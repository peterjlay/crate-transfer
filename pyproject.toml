[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "serato-crate-transfer"
version = "0.1.0"
description = "Manual, paired LAN transfers for Serato DJ 4 crates and music."
requires-python = ">=3.9"
dependencies = [
  "PySide6>=6.8,<6.9",
  "cryptography>=44,<47",
  "zeroconf>=0.140,<1",
  "psutil>=6,<8",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
crate-transfer = "crate_transfer.__main__:main"

[tool.setuptools.packages.find]
include = ["crate_transfer*"]
